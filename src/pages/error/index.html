<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error - Senai Exchange</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="/src/components/sideBar/style.css" />
    <link rel="stylesheet" href="/src/components/topMenu/topMenu.css" />
  </head>
  <body>
    <div class="top-page">
      <header class="top-menu">
        <div class="icon-left">
          <button id="perfil-btn" class="icon-btn" aria-label="Perfil">
            <img
              id="perfil-icon"
              src="/src/assets/images/perfil.svg"
              alt="Perfil"
            />
          </button>
        </div>

        <div class="logo">
          <img
            id="logo-senai"
            src="/src/assets/images/logo-mini.svg"
            alt="Logo SENAI"
          />
        </div>

        <div class="icon-right">
          <button
            id="tema-escuro-toggle"
            class="icon-btn"
            aria-label="Alternar tema escuro"
          >
            <img
              id="tema"
              src="/src/assets/images/moon-icon.svg"
              alt="Tema Escuro"
            />
          </button>
        </div>
      </header>
      <main>
        <div class="error-section">
          <div class="text">
            <h1>Sem novas atualizações</h1>
            <h4>Esse recurso será adicionado em breve!</h4>
          </div>
          <a href="/src/pages/error/index.html">
            <button type="button" id="btnreload">Recarregar</button>
          </a>
        </div>
      </main>
    </div>
    <footer>
      <div class="btn-post">
        <a href="/src/pages/post/index.html">
          <button type="button" id="addpost">
            <img
              src="/src/assets/images/icon-add-post.svg"
              alt="Adicionar post"
            />
          </button>
        </a>
      </div>

      <div class="navbar">
               <div class="container-icons">
          <a href="/index.html">
            <img
              id="dark-theme-home"
              class="home-icons"
              src="/src/assets/images/home-icon.svg"
              alt="icone home para homepage"
            />
          </a>
          <a href="/src/pages/error/index.html">
            <img
              id="dark-theme-bell"
              class="bell-icon"
              src="/src/assets/images/bell-icon.svg"
              alt="icone de sino para notificações"
            />
          </a>
          <a href="/src/pages/error/index.html">
            <img
              id="dark-theme-chat"
              class="chat-icon"
              src="/src/assets/images/chat-icon.svg"
              alt="icone de chat para conversação"
            />
          </a>
          <a href="/src/pages/research/index.html">
            <img
              id="dark-theme-lens"
              class="lens-icon"
              src="/src/assets/images/lens-icon.svg"
              alt="icone de lupa para pesquisa"
            />
          </a>
        </div>
      </footer>
      <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="profile-container">
          <img
            src="/src/assets/images/user-photo-sideBar.svg"
            alt="Foto de perfil"
            class="perfil-img"
          />
          <button id="close-menu" class="close-btn" aria-label="Fechar menu">
            <img src="/src/assets/images/north-star-24.svg" alt="Fechar" />
          </button>
        </div>

        <div class="user-profile">
          <h3>Lyan Brito</h3>
          <p>@Britinho</p>
        </div>
      </div>

      <div class="sidebar-nav">
        <a href="/src/pages/error/index.html">
          <img
            src="/src/assets/images/person-fill-24.svg"
            alt="Perfil"
            class="icon-menu"
          />
          Perfil
        </a>
        <a href="/src/pages/error/index.html">
          <img
            src="/src/assets/images/pencil-24.svg"
            alt="Rascunhos"
            class="icon-menu"
          />
          Rascunhos
        </a>
        <a href="/src/pages/error/index.html">
          <img
            src="/src/assets/images/save-sideaBar.svg"
            alt="Favoritos"
            class="icon-menu"
          />
          Favoritos
        </a>
        <a href="/src/pages/error/index.html">
          <img
            src="/src/assets/images/star-fill-24.svg"
            alt="Destaques"
            class="icon-menu"
          />
          Destaques
        </a>
        <a href="/src/pages/error/index.html">
          <img
            src="/src/assets/images/fire-24.svg"
            alt="Em alta"
            class="icon-menu"
          />
          Em alta
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-footer-content">
          <a href="/index.html" class="logout">
            <img src="/src/assets/images/sign-out.svg" alt="Sair" />
            Sair
          </a>
          <a href="/src/pages/helpPageServices/helpPageServices.html" class="support">
            <img src="/src/assets/images/suport.svg" alt="Suporte" />
          </a>
        </div>
      </div>
    </aside>

      <script src="/src/scripts/script.js"></script>
    </body>
</html>
