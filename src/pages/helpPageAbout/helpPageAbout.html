<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Help About</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/components/topMenu/topMenu.css" />
    <link rel="stylesheet" href="/src/pages/helpPageAbout/style.css" />
    <link rel="stylesheet" href="/src/components/navBar/navBar.css" />
  </head>
  <body>
    <header class="top-menu">
      <div class="icon-left">
        <button id="perfil-btn" class="icon-btn" aria-label="Perfil">
          <img
            id="perfil-icon"
            src="/src/assets/images/perfil.svg"
            alt="Perfil"
          />
        </button>
      </div>

      <div class="logo">
        <img
          id="logo-senai"
          src="/src/assets/images/logo-mini.svg"
          alt="Logo SENAI"
        />
      </div>

      <div class="icon-right">
        <button
          id="tema-escuro-toggle"
          class="icon-btn"
          aria-label="Alternar tema escuro"
        >
          <img
            id="tema"
            src="/src/assets/images/moon-icon.svg"
            alt="Tema Escuro"
          />
        </button>
      </div>
    </header>

    <section>
      <div class="wrapper">
        <div class="question-container">
          <img
            id="helpPageTrianglePointer"
            src="/src/assets/images/trianglePointer-icon.svg"
            alt="icone de um triângulo apontado para o título"
          />
          <p>O que é o SENAI Exchange?</p>
        </div>

        <p>
          O SENAI Exchange é uma comunidade que conecta alunos de diferentes
          cursos da Escola SENAI Suiço Brasileira com o intuito de promover a
          troca de conhecimentos.
        </p>
        <div class="link-hp-services">
          <p>Acesse nossos</p>
          <a href="/src/pages/helpPageServices/helpPageServices.html">
            serviços disponíveis</a
          >
        </div>
      </div>
    </section>

    <footer>
      <div class="container-icons">
        <a href="/index.html">
          <img
            id="dark-theme-home"
            class="home-icons"
            src="/src/assets/images/home-icon.svg"
            alt="icone home para homepage"
          />
        </a>
        <a href="/src/pages/error/index.html">
          <img
            id="dark-theme-bell"
            class="bell-icon"
            src="/src/assets/images/bell-icon.svg"
            alt="icone de sino para notificações"
          />
        </a>
        <a href="/src/pages/error/index.html">
          <img
            id="dark-theme-chat"
            class="chat-icon"
            src="/src/assets/images/chat-icon.svg"
            alt="icone de chat para conversação"
          />
        </a>
        <a href="/src/pages/error/index.html">
          <img
            id="dark-theme-lens"
            class="lens-icon"
            src="/src/assets/images/lens-icon.svg"
            alt="icone de lupa para pesquisa"
          />
        </a>
      </div>
    </footer>
    <script src="/src/scripts/script.js"></script>
  </body>
</html>
